<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cocina XR</title>
<style>
  :root {
    --bg: #f6f4f0; --panel: #fbfaf7; --tinta: #1f1f1d; --suave: #77736b; --linea: #e3dfd8; --acento: #ff6a2b; --peligro: #b3261e;
    --sombra: 0 1px 2px rgba(0,0,0,.06), 0 8px 30px rgba(0,0,0,.08);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--tinta);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d6d0; }
  #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--linea); background: #fff; padding: 7px 10px; border-radius: 0; font-size: 13px; line-height: 1.2; }
  button:hover:not(:disabled) { border-color: var(--tinta); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--tinta); color: #fff; border-color: var(--tinta); }

  #panel { position: fixed; top: 12px; left: 12px; bottom: 76px; width: 352px; background: var(--panel); box-shadow: var(--sombra); display: flex; flex-direction: column; z-index: 5; }
  #panel > header { padding: 14px 16px 10px; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--linea); }
  #panel > header h1 { font-size: 16px; margin: 0; letter-spacing: .01em; }
  #panel > header small { color: var(--suave); font-size: 12px; }
  #pestanas { display: grid; grid-template-columns: 1fr 1.6fr 1fr 1fr; border-bottom: 1px solid var(--linea); }
  #pestanas button { border: 0; border-right: 1px solid var(--linea); padding: 11px 6px; background: transparent; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #pestanas button:last-child { border-right: 0; }
  #pestanas button.on { background: var(--tinta); color: #fff; }
  #panelCuerpo { overflow: auto; padding: 4px 16px 20px; flex: 1; }
  #panelCuerpo h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); margin: 18px 0 8px; font-weight: 600; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { flex: 1 1 auto; }
  .seg.col { flex-direction: column; }
  .seg.col button { text-align: left; }
  .seg.chico button { padding: 5px 6px; font-size: 12px; flex: 0 0 auto; min-width: 38px; }
  .muestras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .muestra { padding: 0 0 6px; display: flex; flex-direction: column; align-items: stretch; text-align: left; gap: 2px; background: #fff; min-width: 0; }
  .muestra i { display: block; height: 38px; border-bottom: 1px solid var(--linea); }
  .muestra b { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-weight: 500; line-height: 1.25; padding-top: 3px; }
  .muestra i.igual { background: repeating-linear-gradient(135deg, #fff 0 6px, #eee 6px 12px); }
  .muestra b { font-size: 12px; padding: 0 6px; }
  .muestra small { font-size: 10.5px; color: var(--suave); padding: 0 6px; line-height: 1.2; }
  .muestra.on { outline: 2px solid var(--tinta); outline-offset: -2px; background: #fff; color: inherit; }
  .rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 10px; }
  .campo { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--suave); }
  .campo > span { font-weight: 500; }
  .campo select { padding: 7px 8px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); font-size: 13px; }
  .num { display: flex; align-items: center; border: 1px solid var(--linea); background: #fff; }
  .num input { width: 100%; border: 0; padding: 7px 8px; font-size: 13px; color: var(--tinta); background: transparent; min-width: 0; }
  .num em { font-style: normal; font-size: 11px; color: var(--suave); padding-right: 4px; white-space: nowrap; }
  .num .paso { border: 0; padding: 7px 9px; background: transparent; font-size: 15px; line-height: 1; color: var(--suave); }
  .num .paso:hover:not(:disabled) { color: var(--tinta); background: #f1efea; }
  /* filas del catálogo (js/opciones.js) */
  .bloque { margin-top: 4px; }
  .bloque > .op, .bloque > .rejilla, .bloque > .acciones, .bloque > .nota, .bloque > .estancias { margin-top: 10px; }
  .bloque > h3 + * { margin-top: 0 !important; }
  .op { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .op > .etq { font-size: 12px; color: var(--suave); font-weight: 500; }
  .op > select { padding: 7px 8px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); font-size: 13px; width: 100%; }
  .acciones { display: flex; flex-wrap: wrap; gap: 4px; }
  .acciones > button { flex: 1 1 auto; }
  .acciones.col { flex-direction: column; }
  .acciones.col > button { text-align: left; }
  .nota.error { color: var(--peligro); } .nota.aviso { color: #8a6400; } .nota.info { color: #2f5d7c; }
  .cab-estancia { display: grid; grid-template-columns: 14px 1fr; gap: 4px 10px; align-items: center; margin-top: 14px; }
  .cab-estancia i { width: 14px; height: 14px; border: 1px solid rgba(0,0,0,.15); }
  .cab-estancia input { font-size: 16px; font-weight: 600; border-color: transparent; background: transparent; padding: 4px 6px; margin-left: -6px; }
  .cab-estancia input:hover, .cab-estancia input:focus { border-color: var(--linea); background: #fff; }
  .cab-estancia small { grid-column: 2; color: var(--suave); font-size: 12px; }
  nav.sub { display: flex; gap: 0; margin-top: 12px; border: 1px solid var(--linea); }
  nav.sub button { flex: 1; border: 0; border-right: 1px solid var(--linea); background: #fff; padding: 8px 4px; font-size: 12.5px; }
  nav.sub button:last-child { border-right: 0; }
  nav.sub button.on { background: var(--tinta); color: #fff; }
  .fila { display: flex; gap: 6px; margin-top: 8px; }
  .fila > * { flex: 1; }
  .fila .num { flex: 2; }
  button.ancho { width: 100%; margin-top: 10px; padding: 10px; font-weight: 600; }
  button.fuerte { background: var(--acento); border-color: var(--acento); color: #fff; }
  button.peligro { color: var(--peligro); }
  .tramos { display: flex; flex-direction: column; gap: 6px; }
  .tramo { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 8px 10px; background: #fff; border: 1px solid var(--linea); font-size: 13px; }
  .tramo span { color: var(--suave); font-size: 12px; }
  .tramo.aviso { border-left: 3px solid #e0a000; }
  .tramo.mal { border-left: 3px solid var(--peligro); }
  .tramo .mini { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 4px; }
  .tramo .mini button { padding: 4px 8px; font-size: 12px; }
  .nota { font-size: 12px; color: var(--suave); line-height: 1.45; margin: 8px 0 0; }
  .hora { display: flex; align-items: center; gap: 12px; }
  .hora input { flex: 1; accent-color: var(--tinta); }
  .hora b { font-variant-numeric: tabular-nums; min-width: 44px; }

  #inspector { position: fixed; top: 12px; right: 12px; width: 320px; max-height: calc(100% - 100px); background: var(--panel); box-shadow: var(--sombra); display: flex; flex-direction: column; z-index: 6; }
  #inspector header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 10px 10px 8px 14px; border-bottom: 1px solid var(--linea); gap: 8px; }
  #inspector .insp-cuerpo { overflow: auto; padding: 2px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  #inspector .insp-cuerpo > :first-child { margin-top: 8px; }
  #inspector .muestras { grid-template-columns: repeat(4, 1fr); }
  #inspector .x { border: 0; font-size: 20px; padding: 0 4px; background: transparent; }

  #barra { position: fixed; left: 12px; right: 12px; bottom: 12px; height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--panel); box-shadow: var(--sombra); z-index: 5; }
  #barra .grupo { display: flex; gap: 4px; }
  #barra .sep { flex: 1; }
  #barra button { height: 36px; }
  #btnVR, #btnAR { background: var(--tinta); color: #fff; border-color: var(--tinta); font-weight: 600; padding: 0 14px; }
  #mallas { font-size: 11px; color: var(--suave); font-variant-numeric: tabular-nums; }
  #fps { font-size: 11px; color: var(--suave); font-variant-numeric: tabular-nums; min-width: 120px; text-align: right; }
  #btnPanel { display: none; }
  /* pestaña Casa */
  .plantillas { display: grid; grid-template-columns: 1fr; gap: 4px; }
  .plantillas button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
  .plantillas small, .estancia small { color: var(--suave); font-size: 11px; }
  .estancias { display: flex; flex-direction: column; gap: 4px; }
  .estancia { display: flex; gap: 4px; }
  .estancia .nombre { flex: 1; display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px; text-align: left; }
  .estancia .nombre i { width: 12px; height: 12px; border: 1px solid rgba(0,0,0,.15); }
  .estancia.on .nombre { outline: 2px solid var(--acento); outline-offset: -2px; }
  .estancia .nombre:not(:has(i)) { grid-template-columns: 1fr auto; }
  input.texto { padding: 7px 8px; border: 1px solid var(--linea); background: #fff; font-size: 13px; color: var(--tinta); min-width: 0; }
  .revision { margin: 0; padding: 0 0 0 16px; font-size: 12px; line-height: 1.5; }
  .revision .error { color: var(--peligro); }
  .revision .aviso { color: #8a6400; }
  .hueco-ed { margin-top: 8px; padding: 10px; background: #fff; border: 1px solid var(--linea); display: flex; flex-direction: column; gap: 8px; }
  .seg.cocinas { margin-top: 12px; }

  /* plano 2D */
  #plano { position: fixed; top: 12px; right: 12px; bottom: 76px; left: 376px; background: #f4f1ea; box-shadow: var(--sombra); z-index: 4; display: flex; flex-direction: column; }
  .plano-barra { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 8px; border-bottom: 1px solid var(--linea); background: var(--panel); }
  .plano-barra .grupo { display: flex; gap: 4px; flex-wrap: wrap; }
  .plano-barra select { padding: 6px; border: 1px solid var(--linea); background: #fff; font-size: 13px; }
  .plano-svg { flex: 1; width: 100%; min-height: 0; touch-action: none; user-select: none; }
  .plano-pie { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 6px 10px; font-size: 12px; color: var(--suave); border-top: 1px solid var(--linea); background: var(--panel); }
  .plano-pie .mal { color: var(--peligro); } .plano-pie .bien { color: #2e7d32; } .plano-pie .ayuda { margin-left: auto; }
  .plano-svg .rejilla line { stroke: #e2ddd2; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .plano-svg .est { stroke: none; cursor: pointer; }
  .plano-svg .est.sel { filter: brightness(1.04); stroke: var(--acento); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .plano-svg .tab { fill: #3b3a36; }
  .plano-svg .tab.ext { fill: #24231f; }
  .plano-svg .borde { stroke: transparent; cursor: move; vector-effect: non-scaling-stroke; }
  .plano-svg .borde:hover { stroke: rgba(255,106,43,.25); }
  .plano-svg .borde.sel { stroke: rgba(255,106,43,.55); }
  .plano-svg .vano { fill: #f4f1ea; }
  .plano-svg .hueco { cursor: ew-resize; }
  .plano-svg .hueco .hoja { stroke: #3b3a36; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .plano-svg .hueco .arco { fill: none; stroke: #8b877e; stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
  .plano-svg .hueco .cristal { stroke: #5b8db8; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  .plano-svg .hueco.sel .vano { fill: #ffd9c8; }
  .plano-svg .vert { fill: #fff; stroke: #3b3a36; stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: grab; }
  .plano-svg .vert:hover { fill: var(--acento); }
  .plano-svg text { text-anchor: middle; dominant-baseline: middle; fill: #4a4740; pointer-events: none; font-family: inherit; }
  .plano-svg .nombre { font-weight: 600; fill: var(--tinta); }
  .plano-svg .m2 { fill: var(--suave); }
  .plano-svg .cotas text { fill: #6d6960; font-variant-numeric: tabular-nums; }
  .plano-svg .cotas text.sel { fill: var(--acento); font-weight: 700; }
  body.con-plano #inspector { display: none; }

  #aviso { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 10px 16px; font-size: 13px; z-index: 20; }

  @media (max-width: 760px) {
    #plano { top: 0; left: 0; right: 0; bottom: 64px; }
    .plano-pie .ayuda { display: none; }
    #panel { top: auto; left: 0; right: 0; bottom: 64px; width: auto; height: 46vh; transform: translateY(calc(100% - 44px)); transition: transform .25s; }
    body.panel-abierto #panel { transform: none; }
    #panel > header { display: none; }
    #inspector { left: 8px; right: 8px; width: auto; top: 8px; max-height: calc(54vh - 80px); }
    body.panel-abierto #inspector { max-height: calc(54vh - 90px); }
    #barra { left: 0; right: 0; bottom: 0; height: 64px; overflow-x: auto; padding-bottom: env(safe-area-inset-bottom); }
    #btnPanel { display: block; }
    #fps, #mallas { display: none; }
    .muestras { grid-template-columns: repeat(4, 1fr); }
  }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/","iwer":"https://cdn.jsdelivr.net/npm/iwer@2.8.0/build/iwer.module.min.js","@iwer/devui":"https://cdn.jsdelivr.net/npm/@iwer/devui@2.8.0/build/iwer-devui.module.min.js","@iwer/sem":"https://cdn.jsdelivr.net/npm/@iwer/sem@2.8.0/build/es-min/index.min.js"}}</script>
</head>
<body>
<canvas id="lienzo"></canvas>

<aside id="panel">
  <header><h1>Cocina XR</h1><small>prototipo · sin precios</small></header>
  <nav id="pestanas">
    <button data-p="casa">Casa</button>
    <button data-p="estancia">Estancia</button>
    <button data-p="luz">Luz</button>
    <button data-p="proyecto">Proyecto</button>
  </nav>
  <div id="panelCuerpo"></div>
</aside>

<section id="inspector" hidden></section>
<section id="plano" hidden></section>

<footer id="barra">
  <button id="btnPanel">Opciones</button>
  <div class="grupo">
    <button data-vista="general">General</button>
    <button data-vista="dentro">Dentro</button>
    <button data-vista="detalle">Detalle</button>
    <button data-vista="planta">Planta</button>
    <button data-vista="plano" title="Editor de planta 2D">Plano</button>
    <button data-vista="paseo" title="WASD para andar, Esc para salir">Paseo</button>
  </div>
  <div class="grupo">
    <button id="btnDeshacer" title="Ctrl+Z">Deshacer</button>
    <button id="btnRehacer" title="Ctrl+Y">Rehacer</button>
  </div>
  <span class="sep"></span>
  <span id="fps"></span>
  <span id="mallas"></span>
  <button id="btnVR" disabled title="Necesita unas gafas con WebXR (Quest)">Entrar en RV</button>
  <button id="btnAR" disabled title="Realidad mixta: ves tu cocina real con la nueva encima">Entrar en RM</button>
</footer>

<input id="abrir" type="file" accept=".json,application/json" hidden>
<div id="aviso" hidden></div>
<!-- ?emular: emulador de gafas (IWER) antes de arrancar la app; ver js/emulador.js -->
<script type="module">if (new URLSearchParams(location.search).has('emular')) await import('./js/emulador.js').catch(e => console.error('Emulador WebXR no disponible', e)); await import('./js/app.js');</script>
</body>
</html>
